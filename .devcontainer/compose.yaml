x-default-unitree-rl-lab-devcontainer-environment: &default-unitree-rl-lab-devcontainer-environment
  - OMNI_KIT_ALLOW_ROOT=1
  - DISPLAY=:0
  - TERM=xterm-256color
  - SHELL=zsh
  - LANG=en_US.UTF-8
  - LANGUAGE=en_US:en
  - LC_ALL=en_US.UTF-8

x-default-unitree-rl-lab-devcontainer-deploy: &default-unitree-rl-lab-devcontainer-deploy
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: all
          capabilities: [ gpu ]

services:
  unitree-rl-lab-devcontainer:
    container_name: unitree-rl-lab-devcontainer
    build:
      dockerfile: Dockerfile
    image: unitree-rl-lab-devcontainer
    volumes:
      - type: bind
        source: ../
        target: /home/ubuntu/unitree_rl_lab
      - type: bind
        source: /dev/dri
        target: /dev/dri
      - type: bind
        source: /dev/input
        target: /dev/input
      - type: bind
        source: /home/max/.ssh
        target: /home/ubuntu/.ssh
    network_mode: host
    environment: *default-unitree-rl-lab-devcontainer-environment
    deploy: *default-unitree-rl-lab-devcontainer-deploy
    # This is the entrypoint for the container
    entrypoint: bash
    stdin_open: true
    tty: true
